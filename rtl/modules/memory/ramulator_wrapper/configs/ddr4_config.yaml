Frontend:
  impl: GEM5
  clock_ratio: 2    # tick every 2 ramulator_tick calls → 800 MHz = SV core clock

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 1    # tick every ramulator_tick call → 1600 MHz = DDR4-3200 memory clock

  DRAM:
    impl: DDR4
    org:
      preset: DDR4_8Gb_x16
      channel: 1
      rank: 1    # 2→1: eliminates rank-switching starvation; bg0/bg1 now alternate freely at tCCD_S=4
    timing:
      preset: DDR4_3200W

  Controller:
    impl: Generic
    read_buffer_size: 256    # deep queue for bank-level parallelism (default was 32)
    write_buffer_size: 64
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy
      cap: 16
    plugins:

  AddrMapper:
    impl: RoBaRaCoCh
